# Configuration Netlify pour Rate Your Track Bogotá

[build]
  # Dossier racine du projet
  base = "frontend"
  
  # Dossier à déployer (contient index.html)
  publish = "public"
  
  # Commande de build : copier src dans public
  command = "bash build.sh"

# Redirections et règles
[[redirects]]
  # Redirection pour SPA (Single Page Application)
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
